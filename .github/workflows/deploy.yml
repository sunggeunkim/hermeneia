name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/hermeneia:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/hermeneia:latest
          cache-from: type=gha,scope=hermeneia
          cache-to: type=gha,mode=max,scope=hermeneia

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Connect to tailnet
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.LXC_SSH_PRIVATE_KEY }}

      - name: Trust guest host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.LXC_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync compose file
        run: |
          scp docker-compose.prod.yml \
            "${{ secrets.LXC_USER }}@${{ secrets.LXC_HOST }}:/opt/hermeneia/docker-compose.prod.yml"

      - name: Pull and restart
        env:
          TAG: ${{ needs.build.outputs.image_tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | ssh "${{ secrets.LXC_USER }}@${{ secrets.LXC_HOST }}" \
            "set -eu; \
             DOCKER_CONFIG=\$(mktemp -d); export DOCKER_CONFIG; \
             trap 'rm -rf \"\$DOCKER_CONFIG\"' EXIT; \
             docker login ghcr.io -u ${{ github.actor }} --password-stdin && \
             cd /opt/hermeneia && \
             IMAGE_TAG=$TAG docker compose -f docker-compose.prod.yml pull && \
             IMAGE_TAG=$TAG docker compose -f docker-compose.prod.yml up -d --remove-orphans && \
             docker image prune -f"

      - name: Verify health
        run: |
          ssh "${{ secrets.LXC_USER }}@${{ secrets.LXC_HOST }}" \
            "for i in \$(seq 1 180); do \
               body=\$(curl -fsS http://localhost:8080/health || true); \
               echo \"\$body\" | grep -q '\"ready\": true' && echo healthy && exit 0; \
               echo \"\$body\" | grep -q '\"ready\":true' && echo healthy && exit 0; \
               sleep 5; \
             done; \
             echo 'health check failed'; \
             docker compose -f /opt/hermeneia/docker-compose.prod.yml logs --tail=100; \
             exit 1"
