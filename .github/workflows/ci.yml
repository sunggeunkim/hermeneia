name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra dev
      # The same entry point the image runs, outside pytest.
      - run: uv run --frozen python -c "import hermeneia.main"
      - run: uv run --frozen pytest
