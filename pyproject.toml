[project]
name = "hermeneia"
version = "0.1.0"
description = "Speech translation server for utterance-sized audio"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.2",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
# CTranslate2 4.x is a CUDA 12 build. Keep every nvidia-* wheel in this venv on
# CUDA 12 so whisper and seamless share one cuBLAS/cuDNN tree.
whisper = [
    "faster-whisper>=1.2.1",
    "nvidia-cublas-cu12>=12.4",
    "nvidia-cuda-runtime-cu12>=12.4",
    "nvidia-cudnn-cu12>=9,<10",
]
# The checkpoint ships only a SentencePiece tokenizer.model. transformers 5
# converts it at load time with sentencepiece and protobuf; without them it
# falls through to a tiktoken reader and the load fails.
seamless = [
    "protobuf>=4",
    "sentencepiece>=0.2",
    "torch>=2.5",
    "transformers>=5",
]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0",
    # No torch: enough to run the real Seamless processor and tokenizer in
    # tests. tests/test_seamless_processor.py checks these stay in `seamless`.
    "protobuf>=4",
    "sentencepiece>=0.2",
    "transformers>=5",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.14"]
build-backend = "uv_build"

# PyPI's Linux torch wheels depend on the CUDA 13 nvidia-* packages. Take torch
# from the CUDA 12.6 index instead so it does not pull a second cuDNN.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
